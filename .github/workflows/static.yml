name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1 : Build & Push sur Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

  # Job 2 : Conteneur temporaire, extraction du HTML et déploiement Pages
  deploy:
    needs: build-and-push
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraire le fichier HTML depuis l'image Docker
        run: |
          mkdir -p public
          # Pull de l'image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          # Création du conteneur temporaire
          docker create --name temp_container ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest
          # Extraction du fichier HTML vers le dossier public
          docker cp temp_container:/usr/share/nginx/html/index.html ./public/index.html
          # Nettoyage du conteneur
          docker rm temp_container

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
